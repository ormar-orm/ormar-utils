name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (rustfmt, clippy, ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Rust format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: pip install ruff
      - name: Ruff lint
        run: ruff check tests
      - name: Ruff format check
        run: ruff format --check tests

  test:
    name: Test (py${{ matrix.python-version }} on ${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install build/test tooling
        run: pip install "maturin>=1.0,<2.0" pytest
      - name: Build abi3 wheel
        run: maturin build --release --out dist
      - name: Install wheel
        run: pip install --no-index --find-links dist ormar-utils
      - name: Run tests
        run: pytest tests/ -v

  test-musl:
    name: Test (musllinux wheel on Alpine)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build musllinux wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          args: --release --out dist
          manylinux: musllinux_1_2
      # Alpine marks its system Python as externally managed (PEP 668), so the
      # wheel is installed into a venv. --no-index is the real assertion here:
      # if the wheel is not tagged musllinux, pip finds no candidate at all and
      # the job fails, which is precisely the breakage being guarded against.
      - name: Install wheel and run tests on Alpine
        run: |
          docker run --rm -v "$PWD:/io" -w /io alpine:latest sh -euc '
            apk add --no-cache python3
            python3 -m venv /venv
            /venv/bin/pip install pytest
            /venv/bin/pip install --no-index --find-links dist ormar-utils
            /venv/bin/pytest tests/ -v
          '

  build:
    name: Build wheels (${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'auto' }})
    needs: [test, test-musl]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          # musl builds for Alpine and other musl-libc distros. glibc wheels are
          # not installable there, so without these pip falls back to the sdist
          # and requires a Rust toolchain on the target machine.
          - os: ubuntu-latest
            target: x86_64
            manylinux: musllinux_1_2
          - os: ubuntu-latest
            target: aarch64
            manylinux: musllinux_1_2
          - os: macos-latest
            target: x86_64
          - os: macos-latest
            target: aarch64
          - os: windows-latest
            target: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # abi3-py310 produces a single stable-ABI wheel per platform that works on
      # CPython 3.10+ (including future releases), so no per-interpreter matrix.
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: ${{ matrix.manylinux || 'auto' }}
      # The manylinux value is part of the name because the glibc and musl
      # builds otherwise collide on os+target, and upload-artifact@v4 rejects
      # duplicate artifact names.
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'auto' }}
          path: dist

  sdist:
    name: Build sdist
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  publish:
    name: Publish to PyPI
    needs: [build, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      # skip-existing keeps a re-run or a partially-completed upload from
      # failing the whole job on files PyPI already has, since a release can
      # otherwise only ever be published once.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
