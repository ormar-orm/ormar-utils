[package]
name = "ormar_rust_utils"
version = "0.1.0"
edition = "2021"
description = "Rust-accelerated utility functions for the ormar ORM"
license = "MIT"

[lib]
name = "ormar_rust_utils"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23.5", features = ["extension-module"] }
base64 = "0.22"
serde_json = "1.0"
indexmap = "2.0"
